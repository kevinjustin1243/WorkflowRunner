services:
  workflow-runner:
    # Local dev: build the image from this repo.
    build: .
    # Homeserver / CI deploy: comment out `build:` above and uncomment the
    # `image:` below to pull the published artifact from GHCR instead.
    # `docker compose pull && docker compose up -d` will then update in place.
    # image: ghcr.io/kevinjustin1243/workflowrunner:latest
    # Bind to localhost only — front this with a TLS-terminating reverse proxy.
    # Drop the "127.0.0.1:" if you really mean to expose 8000 on the LAN.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # First-boot admin seeding. Token is printed to stdout once if you
      # don't pre-seed it — capture it from `docker compose logs`.
      - WR_ADMIN_USERNAME=${WR_ADMIN_USERNAME:-admin}
      - WR_ADMIN_DISPLAY_NAME=${WR_ADMIN_DISPLAY_NAME:-Admin}
      - WR_ADMIN_TOKEN=${WR_ADMIN_TOKEN:-}
      # Per-step timeout fallback (seconds). Each step can still override.
      - WR_STEP_TIMEOUT=${WR_STEP_TIMEOUT:-1800}
      # Failure notification sinks (optional). Either or both.
      - WR_NOTIFY_NTFY_URL=${WR_NOTIFY_NTFY_URL:-}
      - WR_NOTIFY_DISCORD_WEBHOOK=${WR_NOTIFY_DISCORD_WEBHOOK:-}
      # External base URL for run links in notifications, e.g. https://wr.home.lan
      - WR_PUBLIC_BASE_URL=${WR_PUBLIC_BASE_URL:-}
      # Compose-stack roots used by the homelab workflows. Mount them below if you set them.
      - COMPOSE_ROOT=${COMPOSE_ROOT:-/srv/compose}
      - JELLYFIN_COMPOSE_DIR=${JELLYFIN_COMPOSE_DIR:-/srv/compose/jellyfin}
      - JELLYFIN_URL=${JELLYFIN_URL:-http://host.docker.internal:8096}
      - SHOKO_URL=${SHOKO_URL:-http://host.docker.internal:8111}
      # Postgres is the source of truth for accounts/runs/workflows; the
      # mounts below are read on first boot only (empty-table migration).
      - DATABASE_URL=postgresql://workflowrunner:${POSTGRES_PASSWORD:-changeme}@postgres:5432/workflowrunner
    volumes:
      # First-boot migration source for the `workflows` table. After the
      # initial import this is ignored — the DB is authoritative. Mounted
      # read-only so a stray editor can't desync from the DB.
      - ./server/workflows:/app/server/workflows:ro
      # Upgrade-only: uncomment these if you're migrating from a pre-Postgres
      # install and want the runner to import your existing accounts.json /
      # runs.json into the DB on first boot. The files must exist on the host
      # before `docker compose up` or Docker will silently create them as
      # directories. Fresh installs don't need them — accounts are seeded and
      # runs start empty.
      # - ./server/accounts.json:/app/server/accounts.json:ro
      # - ./server/runs.json:/app/server/runs.json:ro
      # Docker socket so the compose/prune/jellyfin workflows can reach the host daemon.
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount your compose-stack root read-write so the update workflows can `docker compose pull/up`.
      # Adjust the host path to match your setup.
      - /srv/compose:/srv/compose
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://127.0.0.1:8000/\", timeout=3).status < 500 else 1)'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    # ── Full host access (uncomment for root-level operations like Gentoo) ────
    #
    # If you want the Gentoo upgrade workflow to actually portage-emerge on the
    # host, this container needs host-level access. The least-bad shape is to
    # exec into the host via nsenter / chroot rather than reproducing portage
    # inside the image. Uncomment selectively:
    #
    # privileged: true          # grants all Linux capabilities
    # pid: "host"               # share host PID namespace (ps sees host procs)
    # network_mode: "host"      # use host network stack (remove "ports" above)
    #
    # volumes:
    #   - /:/host               # entire host filesystem at /host
    #                           # Commands then prefix with `chroot /host …`
    #                           # to act on the host. Be deliberate about
    #                           # which workflows have admin-only edit rights.

  # ── Postgres: source of truth for accounts/runs/workflows + Service A requests
  # Single shared database; each service ensures its own tables on startup
  # (idempotent CREATE TABLE IF NOT EXISTS). The runner does a one-shot
  # import from accounts.json / runs.json / server/workflows/*.yaml on the
  # first boot against an empty schema.

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workflowrunner
      POSTGRES_USER: workflowrunner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Not exposed on the host by default — only services on the compose
    # network reach it. Uncomment for psql access from the dev box.
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflowrunner -d workflowrunner"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Async request → Kafka → run pipeline ──────────────────────────────────
  # Service A (request-service) accepts POST /request from upstream callers,
  # publishes to the workflow.requests topic, and returns a requestId.
  # Service B (listener-service) consumes that topic and POSTs to the runner's
  # /hooks/workflow/{file} endpoint using each workflow's webhook_token.
  # Redpanda is Kafka-API compatible and runs single-node in this stack.

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:19092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      # Internal listener (9092) stays cluster-only; external listener exposes
      # 19092 on the host for rpk / kcat from the dev box. Drop this line in
      # production — only the in-compose services should talk to Kafka.
      - "127.0.0.1:19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health 2>&1 | grep -E 'Healthy:.*true' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  request-service:
    build: ./services/request_service
    ports:
      - "127.0.0.1:8100:8100"
    environment:
      - KAFKA_BOOTSTRAP=redpanda:9092
      - KAFKA_TOPIC=${WORKFLOW_TOPIC:-workflow.requests}
      # If set, POST /request requires header X-Service-Token: <value>.
      # Unset = open (development); set for any externally-reachable deploy.
      - REQUEST_SERVICE_TOKEN=${REQUEST_SERVICE_TOKEN:-}
      - DATABASE_URL=postgresql://workflowrunner:${POSTGRES_PASSWORD:-changeme}@postgres:5432/workflowrunner
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  listener-service:
    build: ./services/listener_service
    environment:
      - KAFKA_BOOTSTRAP=redpanda:9092
      - KAFKA_TOPIC=${WORKFLOW_TOPIC:-workflow.requests}
      - KAFKA_GROUP=workflow-listener
      - WR_BASE_URL=http://workflow-runner:8000
      # Listener reads webhook_token straight from the shared workflows table
      # — no YAML mount required.
      - DATABASE_URL=postgresql://workflowrunner:${POSTGRES_PASSWORD:-changeme}@postgres:5432/workflowrunner
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
      workflow-runner:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
